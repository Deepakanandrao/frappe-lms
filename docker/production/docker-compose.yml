# =============================================================================
# FRAPPE LMS - PRODUCTION DOCKER COMPOSE
# =============================================================================
# This is an all-in-one production setup that "just works" with sensible defaults.
#
# Quick Start:
#   1. Copy .env.example to .env
#   2. (Optional) Modify .env values
#   3. Run: docker compose up -d
#   4. Wait ~2-3 minutes for initialization
#   5. Visit: http://lms.localhost (or your configured URL)
#
# Default credentials:
#   - Username: Administrator
#   - Password: admin (or your FRAPPE_ADMIN_PASSWORD)
# =============================================================================

name: frappe-lms

x-lms-image: &lms_image
    image: ghcr.io/frappe/lms:${LMS_VERSION:-stable}
    pull_policy: ${PULL_POLICY:-always}

x-backend-defaults: &backend_defaults
    <<: *lms_image
    restart: unless-stopped
    volumes:
        - sites:/home/frappe/frappe-bench/sites
        - logs:/home/frappe/frappe-bench/logs
    networks:
        - frappe-network

services:
    # ---------------------------------------------------------------------------
    # CONFIGURATOR - Runs once to set up common configuration
    # ---------------------------------------------------------------------------
    configurator:
        <<: *lms_image
        container_name: frappe-lms-configurator
        restart: "no"
        entrypoint:
            - bash
            - -c
        command:
            - >
                ls -1 apps > sites/apps.txt;
                bench set-config -g db_host $$DB_HOST;
                bench set-config -gp db_port $$DB_PORT;
                bench set-config -g redis_cache "redis://$$REDIS_CACHE";
                bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
                bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
                bench set-config -gp socketio_port $$SOCKETIO_PORT;
                echo "Configuration complete!";
        environment:
            DB_HOST: db
            DB_PORT: "3306"
            REDIS_CACHE: redis:6379
            REDIS_QUEUE: redis:6379
            SOCKETIO_PORT: "9000"
        volumes:
            - sites:/home/frappe/frappe-bench/sites
            - logs:/home/frappe/frappe-bench/logs
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - frappe-network

    # ---------------------------------------------------------------------------
    # CREATE-SITE - Runs once to create the site and install LMS
    # ---------------------------------------------------------------------------
    create-site:
        <<: *lms_image
        container_name: frappe-lms-create-site
        restart: "no"
        entrypoint:
            - bash
            - -c
        command:
            - >
                export start=`date +%s`;
                until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
                  [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
                  [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
                do
                  echo "Waiting for configurator to create sites/common_site_config.json...";
                  sleep 5;
                  if (( `date +%s`-start > 120 )); then
                    echo "Timeout: could not find sites/common_site_config.json with required keys";
                    exit 1;
                  fi;
                done;
                echo "Configuration found!";
                if [[ -d "sites/$$SITE_NAME" ]]; then
                  echo "Site $$SITE_NAME already exists, running migrations...";
                  bench --site $$SITE_NAME migrate --skip-failing || true;
                else
                  echo "Creating new site: $$SITE_NAME";
                  bench new-site $$SITE_NAME \
                    --mariadb-user-host-login-scope='%' \
                    --admin-password=$$ADMIN_PASSWORD \
                    --db-root-username=root \
                    --db-root-password=$$DB_ROOT_PASSWORD \
                    --install-app lms \
                    --set-default;
                fi;
                echo "Site setup complete!";
        environment:
            SITE_NAME: ${SITE_NAME:-lms.localhost}
            ADMIN_PASSWORD: ${FRAPPE_ADMIN_PASSWORD:-admin}
            DB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-admin}
        volumes:
            - sites:/home/frappe/frappe-bench/sites
            - logs:/home/frappe/frappe-bench/logs
        depends_on:
            configurator:
                condition: service_completed_successfully
        networks:
            - frappe-network

    # ---------------------------------------------------------------------------
    # BACKEND - Frappe Gunicorn Server
    # ---------------------------------------------------------------------------
    backend:
        <<: *backend_defaults
        container_name: frappe-lms-backend
        depends_on:
            create-site:
                condition: service_completed_successfully
        environment:
            FRAPPE_REDIS_CACHE: redis://redis:6379
            FRAPPE_REDIS_QUEUE: redis://redis:6379
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "timeout 1s bash -c ':> /dev/tcp/127.0.0.1/8000' || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    # ---------------------------------------------------------------------------
    # FRONTEND - Nginx Reverse Proxy
    # ---------------------------------------------------------------------------
    # ---------------------------------------------------------------------------
    # FRONTEND - Nginx Reverse Proxy
    # ---------------------------------------------------------------------------
    # Note: No 'ports' section - Coolify/reverse proxies connect via internal
    # Docker network to port 8080. For direct access without a proxy, uncomment:
    #   ports:
    #     - "80:8080"
    # ---------------------------------------------------------------------------
    frontend:
        <<: *lms_image
        container_name: frappe-lms-frontend
        restart: unless-stopped
        command:
            - nginx-entrypoint.sh
        environment:
            BACKEND: backend:8000
            FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-lms.localhost}
            SOCKETIO: websocket:9000
            UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-127.0.0.1}
            UPSTREAM_REAL_IP_HEADER: ${UPSTREAM_REAL_IP_HEADER:-X-Forwarded-For}
            UPSTREAM_REAL_IP_RECURSIVE: ${UPSTREAM_REAL_IP_RECURSIVE:-off}
            PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
            CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}
        volumes:
            - sites:/home/frappe/frappe-bench/sites
            - logs:/home/frappe/frappe-bench/logs
        depends_on:
            - backend
            - websocket
        networks:
            - frappe-network

    # ---------------------------------------------------------------------------
    # WEBSOCKET - Real-time updates via Socket.io
    # ---------------------------------------------------------------------------
    websocket:
        <<: *backend_defaults
        container_name: frappe-lms-websocket
        command:
            - node
            - /home/frappe/frappe-bench/apps/frappe/socketio.js
        environment:
            FRAPPE_REDIS_CACHE: redis://redis:6379
            FRAPPE_REDIS_QUEUE: redis://redis:6379
        depends_on:
            create-site:
                condition: service_completed_successfully

    # ---------------------------------------------------------------------------
    # QUEUE WORKERS - Background job processing
    # ---------------------------------------------------------------------------
    queue-short:
        <<: *backend_defaults
        container_name: frappe-lms-queue-short
        command:
            - bench
            - worker
            - --queue
            - short,default
        environment:
            FRAPPE_REDIS_CACHE: redis://redis:6379
            FRAPPE_REDIS_QUEUE: redis://redis:6379
        depends_on:
            create-site:
                condition: service_completed_successfully

    queue-long:
        <<: *backend_defaults
        container_name: frappe-lms-queue-long
        command:
            - bench
            - worker
            - --queue
            - long,default,short
        environment:
            FRAPPE_REDIS_CACHE: redis://redis:6379
            FRAPPE_REDIS_QUEUE: redis://redis:6379
        depends_on:
            create-site:
                condition: service_completed_successfully

    # ---------------------------------------------------------------------------
    # SCHEDULER - Periodic background tasks
    # ---------------------------------------------------------------------------
    scheduler:
        <<: *backend_defaults
        container_name: frappe-lms-scheduler
        command:
            - bench
            - schedule
        depends_on:
            create-site:
                condition: service_completed_successfully

    # ---------------------------------------------------------------------------
    # DATABASE - MariaDB
    # ---------------------------------------------------------------------------
    db:
        image: mariadb:10.6
        container_name: frappe-lms-db
        restart: unless-stopped
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --skip-character-set-client-handshake
            - --skip-innodb-read-only-compressed
            - --innodb-use-native-aio=0
        environment:
            MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-admin}
            MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-admin}
        volumes:
            - db-data:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-p${MARIADB_ROOT_PASSWORD:-admin}",
                ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - frappe-network

    # ---------------------------------------------------------------------------
    # CACHE & QUEUE - Redis
    # ---------------------------------------------------------------------------
    redis:
        image: redis:7-alpine
        container_name: frappe-lms-redis
        restart: unless-stopped
        volumes:
            - redis-data:/data
        networks:
            - frappe-network

# =============================================================================
# VOLUMES - Persistent data storage
# =============================================================================
volumes:
    # Named volumes - data persists across restarts
    # To use host bind mounts instead, modify the volume definitions in each service
    sites:
    logs:
    db-data:
    redis-data:

# =============================================================================
# NETWORKS
# =============================================================================
networks:
    frappe-network:
        driver: bridge
